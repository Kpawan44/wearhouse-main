<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Remix: Stockflow Apex</title>
    
    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Standard Favicon and Icons -->
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="shortcut icon" href="/logo.jpg" />
    
    <!-- iOS / Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/logo.jpg" />
    <link rel="apple-touch-icon" sizes="152x152" href="/logo.jpg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.jpg" />
    <link rel="apple-touch-icon" sizes="167x167" href="/logo.jpg" />
    
    <!-- Safari / iOS App Web Capability -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Stockflow Apex" />
    
    <!-- Theme & Colors -->
    <meta name="theme-color" content="#4f46e5" />

    <div id="root"></div>
